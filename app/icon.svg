<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Absolute Asia Tours">
  <!--
    The brand mark, rebuilt from the artwork rather than drawn by eye.

    The letter was measured off the original PNG: its alpha channel is a clean
    hole where the A is, so scanning rows and columns gives the four stroke
    edges and the two bar edges, each fitted by least squares over 65-85
    samples. The result differs from the original by 1.9% of pixels, nearly all
    of it antialiasing along the edges.

    Three things a drawn-by-eye version got wrong, and this one does not:
    the A is narrow, not splayed; its apex is a virtual point ABOVE the disc,
    so what you see at the top is the letter cut off by the circle rather than
    a point inside it; and the crossbar is not horizontal - it rises to the
    right and tapers, converging to nothing well outside the disc on the left.

    Strokes are knocked out as three quads extended past the circle. They
    overlap, which costs nothing in a mask, and it avoids computing their union.
  -->
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0BA55"/>
      <stop offset="1" stop-color="#B98F28"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="-10" y="-10" width="84" height="84">
      <rect x="-10" y="-10" width="84" height="84" fill="#fff"/>
      <g fill="#000">
        <path d="M34.4 -8L36.96 -8L-0.69 72L-3.15 72Z"/>
        <path d="M22.08 -8L29.79 -8L66.54 72L58.91 72Z"/>
        <path d="M-4 39.42L70 29.26L70 34.75L-4 39.85Z"/>
      </g>
    </mask>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#leaf)" mask="url(#cut)"/>
</svg>
